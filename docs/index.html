<style>
    /* Full screen modern animated overlay */
    #global-page-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        /* Muncull sekejap mata untuk memblocking blank screen (Snap IN) */
        transition: opacity 0.05s ease-out, visibility 0.05s ease-out;
    }
    
    /* Adapt to Dark Mode natively if the `.dark` class is on html/body */
    html.dark #global-page-loader, .dark #global-page-loader {
        background-color: #020618;
    }
    
    #global-page-loader.loader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        /* Menghilang secara elegan memudar pelan pelan (Fade OUT) */
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html.suppress-global-page-loader #global-page-loader {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }
    
    /* Smooth Pulse Animation */
    @keyframes subtlePulse {
        0%, 100% { transform: scale(1) translateZ(0); opacity: 1; }
        50% { transform: scale(1.05) translateZ(0); opacity: 0.8; }
    }
    .loader-brand {
        animation: subtlePulse 2s ease-in-out infinite;
        will-change: transform, opacity;
    }

    .loader-slow-hint {
        opacity: 0;
        transition: opacity 0.25s ease;
    }

    #global-page-loader.loader-slow .loader-slow-hint {

    /* Gradient Spinner */

</style>

<script>
    (() => {
        const suppressStorageKey = 'ista.globalPageLoader.suppressOnce';

        const consumeSuppressLoader = () => {
            if (window.__suppressGlobalPageLoaderOnce === true) {
                window.__suppressGlobalPageLoaderOnce = false;
                return true;
            }

            try {
                if (window.sessionStorage?.getItem(suppressStorageKey) === '1') {
                    window.sessionStorage.removeItem(suppressStorageKey);
                    return true;
                }
            } catch (_) {
                // ignore storage read errors
            }

            return false;
        };

        consumeSuppressLoader();

        if (!window.__globalPageLoaderHandlers) {
            const showLoader = () => {
                if (consumeSuppressLoader()) {
                    return;
                }

                const loaderEl = document.getElementById('global-page-loader');
                if (loaderEl) {
                    loaderEl.classList.remove('loader-hidden');
                    window.clearTimeout(window.__globalPageLoaderSlowTimer);
                    window.__globalPageLoaderSlowTimer = window.setTimeout(() => loaderEl.classList.add('loader-slow'), 2500);
                    loaderEl.removeAttribute('aria-hidden');
                    loaderEl.setAttribute('role', 'status');
                }
            };

            const hideLoader = () => {
                const loaderEl = document.getElementById('global-page-loader');
                if (loaderEl) {
                    window.clearTimeout(window.__globalPageLoaderSlowTimer);
                    loaderEl.classList.remove('loader-slow');
                    setTimeout(() => {
                        loaderEl.classList.add('loader-hidden');
                        loaderEl.setAttribute('aria-hidden', 'true');
                        loaderEl.removeAttribute('role');
                        document.documentElement.classList.remove('suppress-global-page-loader');
                    }, 150);
                }
            };

            const onPageShow = (e) => {
                if (e.persisted) hideLoader();
            };

            window.__globalPageLoaderHandlers = {
                showLoader,
                hideLoader,
                onPageShow,
            };

            // Standard page transitions
            window.addEventListener('beforeunload', showLoader);
            window.addEventListener('load', hideLoader);

            // Fallback for BFCache (Back/Forward navigation)
            window.addEventListener('pageshow', onPageShow);

            // Livewire SPA mode support (wire:navigate)
            document.addEventListener('livewire:navigating', showLoader);
            document.addEventListener('livewire:navigated', hideLoader);
        }

        // Safety fallback (force hide after 8 seconds)
        setTimeout(window.__globalPageLoaderHandlers.hideLoader, 8000);
    })();
</script>
